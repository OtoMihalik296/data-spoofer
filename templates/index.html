<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Data Spoofer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="shell">
    <header class="brand">
      <h1 class="brand-mark">Data Spoofer</h1>
      <p class="brand-line">Zmaž staré metadata a zapíš nové — fotky aj videá, telefón, čas, GPS z mapy.</p>
    </header>

    <main class="stage">
      <form id="spoof-form" class="panel" novalidate>
        <label class="drop" id="dropzone" for="media">
          <input type="file" id="media" name="file" accept=".mp4,.mov,.m4v,.3gp,.jpg,.jpeg,.heic,.heif,.png,.webp,.tif,.tiff,.dng,video/*,image/*" multiple required />
          <span class="drop-title" id="drop-title">Presuň fotky alebo video sem</span>
          <span class="drop-hint">viac súborov naraz · JPG / HEIC / PNG · MP4 / MOV · max 200&nbsp;MB</span>
        </label>
        <ul class="file-list" id="file-list" hidden></ul>

        <div class="grid">
          <label class="field">
            <span>Telefón</span>
            <select id="phone" name="phone"></select>
          </label>

          <label class="field">
            <span>Dátum a čas</span>
            <input type="datetime-local" id="when" name="when" />
          </label>

          <label class="field">
            <span>Rýchla lokalita</span>
            <select id="location" name="location"></select>
          </label>

          <div class="toggles">
            <label class="check">
              <input type="checkbox" id="random" name="random" />
              <span>Random telefón + čas</span>
            </label>
            <label class="check">
              <input type="checkbox" id="no_gps" name="no_gps" />
              <span>Bez GPS</span>
            </label>
            <label class="check">
              <input type="checkbox" id="wipe" name="wipe" checked />
              <span>Wipe všetkých starých metadata</span>
            </label>
          </div>
        </div>

        <section class="map-block" id="map-block">
          <div class="map-head">
            <div>
              <h2 class="section-title">Presné GPS</h2>
              <p class="map-hint">Klikni na mapu alebo ťahaj pin.</p>
            </div>
            <p class="place-label" id="place-label">—</p>
          </div>
          <div id="map" class="map" role="application" aria-label="Mapa na výber GPS"></div>
          <div class="coords">
            <label class="field">
              <span>Lat</span>
              <input type="number" id="lat" name="lat" step="0.000001" />
            </label>
            <label class="field">
              <span>Lon</span>
              <input type="number" id="lon" name="lon" step="0.000001" />
            </label>
            <label class="field">
              <span>Alt (m)</span>
              <input type="number" id="alt" name="alt" step="0.1" />
            </label>
          </div>
          <input type="hidden" id="city" name="city" />
          <input type="hidden" id="country" name="country" />
          <input type="hidden" id="country_code" name="country_code" />
        </section>

        <section class="camera-block" id="camera-block">
          <div class="map-head">
            <div>
              <h2 class="section-title">Kamera (editovateľné)</h2>
              <p class="map-hint">Predvyplnené podľa telefónu — môžeš zmeniť. Platí hlavne pre fotky.</p>
            </div>
            <button type="button" class="btn ghost" id="resample-cam">Náhodné ISO/čas</button>
          </div>
          <div class="camera-grid">
            <label class="field">
              <span>Ohnisko (mm)</span>
              <input type="number" id="focal_mm" name="focal_mm" step="0.01" />
            </label>
            <label class="field">
              <span>Clona (f/)</span>
              <input type="number" id="fnumber" name="fnumber" step="0.01" />
            </label>
            <label class="field">
              <span>35mm equiv</span>
              <input type="number" id="focal_35" name="focal_35" step="1" />
            </label>
            <label class="field">
              <span>ISO</span>
              <input type="number" id="iso" name="iso" step="1" min="25" />
            </label>
            <label class="field">
              <span>Čas (1 / …)</span>
              <div class="shutter-row">
                <input type="number" id="exposure_num" name="exposure_num" step="1" min="1" value="1" />
                <span class="shutter-sep">/</span>
                <input type="number" id="exposure_den" name="exposure_den" step="1" min="1" />
              </div>
            </label>
            <label class="field">
              <span>Lens make</span>
              <input type="text" id="lens_make" name="lens_make" />
            </label>
            <label class="field field-wide">
              <span>Lens model</span>
              <input type="text" id="lens_model" name="lens_model" />
            </label>
          </div>
        </section>

        <div class="actions">
          <button type="submit" class="btn primary" id="submit-btn">Spoofnúť metadata</button>
          <p class="status" id="status" role="status"></p>
        </div>
      </form>

      <aside class="result" id="result" hidden>
        <div class="result-head">
          <h2>Hotovo</h2>
          <a class="btn secondary" id="download-btn" href="/api/download">Stiahnuť</a>
        </div>
        <dl class="summary" id="summary"></dl>
        <div class="meta-wrap">
          <h3>Zapísané tagy</h3>
          <pre id="meta" class="meta"></pre>
        </div>
      </aside>
    </main>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="/static/app.js"></script>
</body>
</html>
