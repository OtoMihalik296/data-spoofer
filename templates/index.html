<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Data Spoofer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="shell">
    <header class="brand">
      <h1 class="brand-mark">Data Spoofer</h1>
      <p class="brand-line">Zmaž staré metadata a zapíš nové — telefón, čas, presné GPS z mapy.</p>
    </header>

    <main class="stage">
      <form id="spoof-form" class="panel" novalidate>
        <label class="drop" id="dropzone" for="video">
          <input type="file" id="video" name="video" accept=".mp4,.mov,.m4v,.3gp,video/mp4,video/quicktime" required />
          <span class="drop-title" id="drop-title">Presuň video sem</span>
          <span class="drop-hint">alebo klikni · MP4 / MOV · max 512&nbsp;MB</span>
        </label>

        <div class="grid">
          <label class="field">
            <span>Telefón</span>
            <select id="phone" name="phone"></select>
          </label>

          <label class="field">
            <span>Dátum a čas</span>
            <input type="datetime-local" id="when" name="when" />
          </label>

          <label class="field">
            <span>Rýchla lokalita</span>
            <select id="location" name="location"></select>
          </label>

          <div class="toggles">
            <label class="check">
              <input type="checkbox" id="random" name="random" />
              <span>Random telefón + čas</span>
            </label>
            <label class="check">
              <input type="checkbox" id="no_gps" name="no_gps" />
              <span>Bez GPS</span>
            </label>
            <label class="check">
              <input type="checkbox" id="wipe" name="wipe" checked />
              <span>Wipe všetkých starých metadata</span>
            </label>
          </div>
        </div>

        <section class="map-block" id="map-block">
          <div class="map-head">
            <div>
              <h2 class="section-title">Presné GPS</h2>
              <p class="map-hint">Klikni na mapu alebo ťahaj pin.</p>
            </div>
            <p class="place-label" id="place-label">—</p>
          </div>
          <div id="map" class="map" role="application" aria-label="Mapa na výber GPS"></div>
          <div class="coords">
            <label class="field">
              <span>Lat</span>
              <input type="number" id="lat" name="lat" step="0.000001" />
            </label>
            <label class="field">
              <span>Lon</span>
              <input type="number" id="lon" name="lon" step="0.000001" />
            </label>
            <label class="field">
              <span>Alt (m)</span>
              <input type="number" id="alt" name="alt" step="0.1" />
            </label>
          </div>
          <input type="hidden" id="city" name="city" />
          <input type="hidden" id="country" name="country" />
          <input type="hidden" id="country_code" name="country_code" />
        </section>

        <div class="actions">
          <button type="submit" class="btn primary" id="submit-btn">Spoofnúť metadata</button>
          <p class="status" id="status" role="status"></p>
        </div>
      </form>

      <aside class="result" id="result" hidden>
        <div class="result-head">
          <h2>Hotovo</h2>
          <a class="btn secondary" id="download-btn" href="/api/download">Stiahnuť video</a>
        </div>
        <dl class="summary" id="summary"></dl>
        <div class="meta-wrap">
          <h3>Zapísané tagy</h3>
          <pre id="meta" class="meta"></pre>
        </div>
      </aside>
    </main>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="/static/app.js"></script>
</body>
</html>
